<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="タスク管理アプリ TaskMaid の公式サポートサイトです。">
  <title>TaskMaid 公式サポート</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">TaskMaid</a>
    <nav aria-label="主要メニュー">
      <a href="/taskmaid/privacy/">プライバシー</a>
      <a href="/taskmaid/support/">サポート</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">やさしく続けるタスク管理</p>
      <h1>毎日のタスクを、<br>メイドと一緒に。</h1>
      <p>TaskMaidは、タスク整理、カレンダー、集中タイマーをひとつにまとめたiPhone向けタスク管理アプリです。</p>
      <div class="actions">
        <a class="button" href="/taskmaid/support/">サポートを見る</a>
        <a class="text-link" href="/taskmaid/en/">English</a>
      </div>
    </section>
    <section class="cards" aria-label="サイト案内">
      <a class="card" href="/taskmaid/privacy/">
        <h2>プライバシーポリシー</h2>
        <p>アプリ内データと広告に関する情報の取扱いをご確認いただけます。</p>
      </a>
      <a class="card" href="/taskmaid/support/">
        <h2>サポート</h2>
        <p>よくある質問、不具合のご連絡、データ削除方法をご案内します。</p>
      </a>
      <a class="card" href="/taskmaid/terms/">
        <h2>利用規約</h2>
        <p>TaskMaidをご利用いただく際の条件をご案内します。</p>
      </a>
    </section>
  </main>
  <footer>© 2026 TaskMaid</footer>
</body>
</html>
